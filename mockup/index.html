<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrive · 휴식 목업</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; isolation: isolate; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      linear-gradient(var(--color-scrim), var(--color-scrim)),
      url("../app/src/main/res/drawable-nodpi/aurora_grain.png") center / cover no-repeat,
      url("../app/src/main/res/drawable-nodpi/aurora_wave.png") 85% 80% / 124.61% 124.68% no-repeat,
      var(--color-brand);
  }
  main { max-width: calc(var(--content-max) + 2 * var(--space-3xl)); margin: auto; padding: var(--space-3xl); }
  header, .status, .section-heading, .readout, .metric, .activity { display: flex; align-items: center; }
  header { justify-content: space-between; flex-wrap: wrap; gap: var(--space-xl); margin-bottom: var(--space-section); }
  .brand { font: var(--type-headline-medium); font-weight: 700; }
  .status { gap: var(--space-lg); font: var(--type-body-small); color: var(--color-text-secondary); }
  .parked { padding: var(--space-md) var(--space-lg); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-pill); color: var(--color-accent); background: var(--color-glass); white-space: nowrap; font: var(--type-label-small); }
  .parked span { margin-right: var(--space-xs); }
  h1 { margin: 0 0 var(--space-sm); font: var(--type-headline); }
  .intro { margin: 0 0 var(--space-section); font: var(--type-body); color: var(--color-text-secondary); }
  .dashboard { display: grid; grid-template-columns: 1.7fr 1fr; gap: var(--space-xl); }
  .hero, .vehicle { min-width: 0; min-height: var(--card-min-height); background: var(--color-reading-surface); border: var(--border-width) solid var(--color-border); border-radius: var(--radius-panel); padding: var(--space-2xl); }
  .eyebrow { margin: 0 0 var(--space-md); font: var(--type-label-small); color: var(--color-accent); }
  h2 { margin: 0 0 var(--space-md); font: var(--type-headline-medium); }
  .description { margin: 0 0 var(--space-lg); font: var(--type-body); color: var(--color-text-secondary); min-height: 80px; white-space: pre-line; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: var(--focus-width) solid var(--color-text); outline-offset: var(--space-xs); }
  button:active { filter: brightness(.92); }
  .primary { border: 0; border-radius: var(--radius-pill); background: var(--color-text); color: var(--color-background); min-height: var(--touch-target); padding: var(--space-md) var(--space-2xl); font: var(--type-label); }
  .primary:focus-visible { outline-color: var(--color-accent); }
  .primary .duration { display: inline-block; color: var(--color-brand); margin-left: var(--space-sm); font: var(--type-label-small); }
  .vehicle h2 { font: var(--type-title-small); color: var(--color-text-secondary); margin: 0 0 var(--space-lg); }
  .readout { align-items: baseline; flex-wrap: wrap; gap: var(--space-sm); }
  .readout strong { font: var(--type-display); font-variant-numeric: tabular-nums; }
  .readout .percent { color: var(--color-text-secondary); font: var(--type-unit); }
  .readout .battery-label { margin-left: auto; color: var(--color-text-secondary); font: var(--type-body-small); }
  .battery { height: var(--progress-height); background: var(--color-border); border-radius: var(--radius-pill); margin: var(--space-lg) 0; overflow: hidden; }
  .battery span { display: block; height: 100%; width: 78%; background: var(--color-accent); border-radius: inherit; }
  .metric { justify-content: space-between; flex-wrap: wrap; gap: var(--space-lg); font: var(--type-label-small); margin-top: var(--space-lg); }
  .metric span { color: var(--color-text-secondary); font: var(--type-body-small); }
  .section-heading { margin: var(--space-2xl) 0 var(--space-lg); flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); }
  .section-heading h2 { font: var(--type-title); margin: 0; }
  .section-heading span { color: var(--color-text-secondary); font: var(--type-body-small); }
  .activities { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-lg); }
  .activity { border: var(--border-width) solid var(--color-border); border-radius: var(--radius-panel); background: var(--color-glass); color: inherit; padding: var(--space-xl); gap: var(--space-lg); min-height: var(--activity-min-height); text-align: left; }
  .activity[aria-pressed="true"] { background: var(--color-glass-selected); border-color: var(--color-border-strong); }
  .number { color: var(--color-text-secondary); font: var(--type-label-small); }
  .activity[aria-pressed="true"] .number, .activity[aria-pressed="true"] .mark { color: var(--color-accent); }
  .activity-title { display: block; font: var(--type-title-small); }
  .activity-duration { display: block; margin-top: var(--space-xs); color: var(--color-text-secondary); font: var(--type-body-small); }
  .mark { margin-left: auto; color: var(--color-text-secondary); font: var(--type-title); }
  @media (max-width: 759px) {
    main { padding: var(--space-2xl); }
    header { gap: var(--space-sm); }
    .dashboard, .activities { grid-template-columns: 1fr; }
    h1 { font: var(--type-headline-medium); }
    .intro { margin-bottom: var(--space-2xl); }
  }
</style>
<main>
  <header>
    <div class="brand">thrive</div>
    <div class="status"><span>예시 데이터</span><div class="parked"><span aria-hidden="true">●</span>정차 중</div></div>
  </header>
  <h1>잠깐 멈춰도 괜찮아요.</h1>
  <p class="intro">다음 여정을 위한, 나만의 작은 쉼.</p>
  <div class="dashboard">
    <section class="hero" aria-label="추천 휴식">

      <div class="hero-content">
        <p class="eyebrow" id="eyebrow">지금 나에게 필요한 쉼</p>
        <h2 id="rest-title">천천히, 깊게 호흡</h2>
        <p class="description" id="description">바쁘게 달려온 오늘,
숨을 고르는 시간을 가져보세요.</p>
        <button class="primary" id="rest-toggle" aria-pressed="false"><span id="button-label">휴식 시작</span><span class="duration">· <span id="duration">3분</span></span></button>
      </div>
    </section>
    <section class="vehicle" aria-label="예시 차량 상태">
      <h2>지금 내 차는</h2>
      <div class="readout"><strong>78</strong><span class="percent">%</span><span class="battery-label">배터리</span></div>
      <div class="battery" role="progressbar" aria-label="예시 배터리" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"><span></span></div>
      <div class="metric"><span>주행 가능 거리</span>324 km</div>
      <div class="metric"><span>실내 온도</span>22°</div>
    </section>
  </div>
  <div class="section-heading"><h2>어떻게 쉬어볼까요?</h2><span>나에게 맞는 쉼 선택</span></div>
  <div class="activities" role="group" aria-label="휴식 선택">
    <button class="activity" aria-pressed="true" data-option="0"><span class="number" aria-hidden="true">01</span><span><span class="activity-title">천천히, 깊게 호흡</span><span class="activity-duration">3분</span></span><span class="mark" aria-hidden="true">●</span></button>
    <button class="activity" aria-pressed="false" data-option="1"><span class="number" aria-hidden="true">02</span><span><span class="activity-title">가볍게 몸 풀기</span><span class="activity-duration">5분</span></span><span class="mark" aria-hidden="true">↗</span></button>
    <button class="activity" aria-pressed="false" data-option="2"><span class="number" aria-hidden="true">03</span><span><span class="activity-title">아무것도 하지 않기</span><span class="activity-duration">10분</span></span><span class="mark" aria-hidden="true">↗</span></button>
  </div>
  <div id="announcement" role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</main>
<script>
  const options = [
    { title: '천천히, 깊게 호흡', duration: '3분', description: '바쁘게 달려온 오늘,\n숨을 고르는 시간을 가져보세요.' },
    { title: '가볍게 몸 풀기', duration: '5분', description: '오래 앉아 있던 몸에,\n가벼운 움직임을 선물하세요.' },
    { title: '아무것도 하지 않기', duration: '10분', description: '무언가를 채우지 않아도 좋아요.\n잠시 편안하게 머물러보세요.' }
  ];
  let selected = 0;
  let resting = false;
  const byId = id => document.getElementById(id);
  function render() {
    const option = options[selected];
    byId('rest-title').textContent = option.title;
    byId('duration').textContent = option.duration;
    byId('eyebrow').textContent = resting ? '나에게 집중하는 시간' : '지금 나에게 필요한 쉼';
    byId('description').textContent = resting ? '어깨의 힘을 빼고, 잠시 쉬어가세요.' : option.description;
    byId('button-label').textContent = resting ? '휴식 마치기' : '휴식 시작';
    byId('rest-toggle').setAttribute('aria-pressed', String(resting));
    document.querySelectorAll('.activity').forEach((button, index) => {
      button.setAttribute('aria-pressed', String(index === selected));
      button.querySelector('.mark').textContent = index === selected ? '●' : '↗';
    });
    byId('announcement').textContent = `${option.title}, ${resting ? '휴식 중' : option.duration + ' 선택됨'}`;
  }
  byId('rest-toggle').addEventListener('click', () => { resting = !resting; render(); });
  document.querySelectorAll('.activity').forEach(button => button.addEventListener('click', () => {
    selected = Number(button.dataset.option); resting = false; render();
  }));
</script>
</html>
